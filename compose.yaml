
services:
  database:
    image: postgres:17
    restart: unless-stopped

    ports:
      - "127.0.0.1:5432:5432"

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Required}
      POSTGRES_USER: ${POSTGRES_USER:?Required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"'
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - cyberlab_network
    
  sqli-db:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_DB: cyberlab_sqli
      POSTGRES_USER: sqli_owner
      POSTGRES_PASSWORD: ${SQLI_DB_PASSWORD:?Required}
      SQLI_READER_PASSWORD: ${SQLI_READER_PASSWORD:?Required}

    volumes:
      - sqli_data:/var/lib/postgresql/data
      - ./database/sqli/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"'
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - cyberlab_network


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    restart: unless-stopped

    ports:
      - "127.0.0.1:8080:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080

      ConnectionStrings__DefaultConnection: >-
        Host=database;
        Port=5432;
        Database=${POSTGRES_DB:?Required};
        Username=${POSTGRES_USER:?Required};
        Password=${POSTGRES_PASSWORD:?Required}
        
      ConnectionStrings__SqlInjectionDemo: "Host=sqli-db;Port=5432;Database=cyberlab_sqli;Username=sqli_reader;Password=${SQLI_READER_PASSWORD:?Required}"

    depends_on:
      database:
        condition: service_healthy
      sqli-db:
        condition: service_healthy

    networks:
      - cyberlab_network

volumes:
  postgres_data:
  sqli_data:

networks:
  cyberlab_network:
    driver: bridge
